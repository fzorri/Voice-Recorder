name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - uses: FossifyOrg/.github/.github/actions/gradle-cache@main

      # stable debug signing key: restores the same signature on every run so new APKs
      # install in place (no uninstall/re-grant); falls back to AGP's random key if unset
      - name: Restore stable debug keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Stable debug keystore restored"
          else
            echo "::warning::DEBUG_KEYSTORE_B64 secret not set - using a random keystore for this run"
          fi

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleFossDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: foss-debug-apk
          path: app/build/outputs/apk/foss/debug/*debug.apk
